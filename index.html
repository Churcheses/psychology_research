<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理学論文 AI要約＆サーチポータル</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 作成したカスタムCSSの読み込み -->
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<!-- ヘッダー -->
  <header class="bg-indigo-600 dark:bg-slate-900 text-white shadow-md transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 py-8 flex justify-between items-center">
      <div>
        <div class="flex items-center space-x-3 mb-2">
          <span class="text-3xl">🧠</span>
          <h1 class="text-2xl sm:text-3xl font-bold">心理学論文 AI要約＆サーチポータル</h1>
        </div>
        <p class="text-indigo-100 dark:text-slate-400 text-sm sm:text-base">最新の心理学研究を初心者にもわかりやすく解説。日常で使える実践知識へ。</p>
      </div>
      <!-- ダークモード切り替えボタン -->
      <button onclick="toggleDarkMode()" class="p-2.5 bg-indigo-700 dark:bg-slate-800 hover:bg-indigo-800 dark:hover:bg-slate-700 rounded-lg text-lg transition-colors border border-indigo-500 dark:border-slate-700" title="ダークモード切り替え">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- モード切り替えタブ -->
    <div class="flex border-b border-slate-200 mb-6 space-x-4">
      <button id="tabDb" onclick="switchTab('db')" 
        class="pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-indigo-600 text-indigo-600 flex items-center space-x-2">
        <span>📚 蓄積済み要約カード</span>
      </button>
      <button id="tabLive" onclick="switchTab('live')" 
        class="pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center space-x-2">
        <span>🌐 ライブ論文サーチ (OpenAlex)</span>
      </button>
    </div>

    <!-- ==================== TAB 1: 蓄積データベース検索 ==================== -->
    <div id="sectionDb">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
          <!-- 検索バー -->
          <div class="relative w-full md:w-96">
            <input type="text" id="searchInput" placeholder="要約カード内を検索 (例: 記憶、睡眠)..." 
              class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>

          <!-- カテゴリフィルター -->
          <div class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="categoryFilterContainer"></div>
        </div>

        <div class="mt-4 text-xs sm:text-sm text-slate-500 flex justify-between items-center border-t border-slate-100 pt-3">
          <span id="resultCount">読み込み中...</span>
          <span>毎日自動更新中</span>
        </div>
      </div>

      <!-- カード表示エリア -->
      <div id="paperGrid" class="grid grid-cols-1 gap-6"></div>
      <div id="noResults" class="hidden text-center py-16">
        <p class="text-4xl mb-3">🔍</p>
        <p class="text-slate-600 font-medium">条件に合う要約カードが見つかりませんでした。</p>
      </div>
    </div>

    <!-- TAB 2: ライブ論文サーチ -->
    <div id="sectionLive" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-8">
        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-500 mb-1">🔍 検索エンジンを選択</label>
          <select id="searchEngineSelect" class="w-full sm:w-64 p-2 border border-slate-300 rounded-lg text-sm bg-white text-black">
            <option value="openalex">OpenAlex (世界最大の論文DB)</option>
            <option value="semanticscholar">Semantic Scholar (AI搭載論文DB)</option>
          </select>
        </div>

        <!-- 検索入力バー -->
        <div class="flex gap-2">
          <div class="relative flex-grow">
            <input type="text" id="liveSearchInput" placeholder="英語キーワードを入力 (例: memory, sleep, anxiety)..." 
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <button onclick="executeLiveSearch()" 
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors flex items-center space-x-1 whitespace-nowrap">
            <span>検索</span>
          </button>
        </div>
      </div>

      <!-- 検索結果表示エリア -->
      <div id="liveLoading" class="hidden text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-2"></div>
        <p class="text-sm text-slate-500">論文を検索中...</p>
      </div>

      <div id="liveResultsGrid" class="grid grid-cols-1 gap-4"></div>
    </div>

  </main>

  <footer class="bg-slate-800 text-slate-400 py-6 mt-12">
    <div class="max-w-5xl mx-auto px-4 text-center text-xs space-y-2">
      <p>Data provided by OpenAlex API & Google Gemini API</p>
      <p>&copy; 心理学論文 AI要約＆サーチポータル</p>
    </div>
  </footer>

  <!-- スクリプト定義 -->
  <script>
    let allPapers = [];
    let currentCategory = 'ALL';
    let liveSearchResults = []; // 検索結果の一時保持用

    // ダークモード切替処理
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    // 初期化処理
    function initSettings() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        const icon = document.getElementById('themeIcon');
        if (icon) icon.textContent = '☀️';
      }
    }
    document.addEventListener('DOMContentLoaded', initSettings);

    // タブ切り替え
    function switchTab(tab) {
      const sectionDb = document.getElementById('sectionDb');
      const sectionLive = document.getElementById('sectionLive');
      const tabDb = document.getElementById('tabDb');
      const tabLive = document.getElementById('tabLive');

      if (tab === 'db') {
        sectionDb.classList.remove('hidden');
        sectionLive.classList.add('hidden');
        tabDb.className = "pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-indigo-600 text-indigo-600 flex items-center space-x-2";
        tabLive.className = "pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center space-x-2";
      } else {
        sectionDb.classList.add('hidden');
        sectionLive.classList.remove('hidden');
        tabLive.className = "pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-indigo-600 text-indigo-600 flex items-center space-x-2";
        tabDb.className = "pb-3 px-4 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center space-x-2";
      }
    }

    // 1. JSONデータの読み込み (蓄積カード用)
    async function loadPapers() {
      try {
        const response = await fetch('data/papers.json');
        if (!response.ok) throw new Error('Data load failed');
        allPapers = await response.json();
        
        setupCategoryFilters();
        renderPapers();
      } catch (error) {
        console.error('Error loading papers:', error);
        document.getElementById('paperGrid').innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-center">
            <p class="font-bold mb-1">蓄積論文データがまだありません</p>
            <p class="text-sm">GitHub Actionsが初回実行されると、ここに要約カードが自動追加されます。</p>
          </div>
        `;
        document.getElementById('resultCount').textContent = '掲載数: 0 件';
      }
    }

    // カテゴリフィルター作成
    function setupCategoryFilters() {
      const categories = ['ALL', ...new Set(allPapers.map(p => p.category || '未分類'))];
      const container = document.getElementById('categoryFilterContainer');
      
      container.innerHTML = categories.map(cat => {
        const label = cat === 'ALL' ? 'すべて' : cat;
        return `
          <button onclick="filterCategory('${cat}')" 
            class="cat-btn text-xs sm:text-sm px-3 py-1.5 rounded-full border whitespace-nowrap transition-colors
            ${cat === 'ALL' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}"
            data-category="${cat}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.category === cat) {
          btn.className = 'cat-btn text-xs sm:text-sm px-3 py-1.5 rounded-full border whitespace-nowrap bg-indigo-600 text-white border-indigo-600';
        } else {
          btn.className = 'cat-btn text-xs sm:text-sm px-3 py-1.5 rounded-full border whitespace-nowrap bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
        }
      });
      renderPapers();
    }

    // 蓄積カード描画
    function renderPapers() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allPapers.filter(paper => {
        const matchesCategory = currentCategory === 'ALL' || (paper.category || '未分類') === currentCategory;
        const searchTarget = `${paper.title} ${paper.summary} ${paper.background} ${paper.findings} ${paper.application} ${paper.original_title}`.toLowerCase();
        return matchesCategory && searchTarget.includes(query);
      });

      document.getElementById('resultCount').textContent = `表示中: ${filtered.length} / 全 ${allPapers.length} 件`;
      const grid = document.getElementById('paperGrid');
      const noResults = document.getElementById('noResults');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');

      grid.innerHTML = filtered.map(paper => `
        <!-- 超要約 -->
          <div class="bg-indigo-50/70 dark:bg-slate-800 px-5 sm:px-6 py-3 border-b border-slate-100 dark:border-slate-700 text-sm text-indigo-950 dark:text-indigo-200 font-medium leading-relaxed">
            💡 <strong>超要約:</strong> ${paper.summary}
          </div>

          <!-- 詳細コンテンツ -->
          <div class="p-5 sm:p-6 space-y-4 text-sm text-slate-700 dark:text-slate-300">
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white flex items-center mb-1 text-xs uppercase tracking-wider text-indigo-600 dark:text-indigo-400">❓ なぜ研究したの？（背景）</h3>
              <p class="leading-relaxed bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700">${paper.background}</p>
            </div>

            <div>
              <h3 class="font-bold text-slate-900 dark:text-white flex items-center mb-1 text-xs uppercase tracking-wider text-indigo-600 dark:text-indigo-400">🧪 何がわかったの？（結論）</h3>
              <p class="leading-relaxed bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700">${paper.findings}</p>
            </div>

            <!-- ★複数論文の横断知見 -->
            ${paper.overall_insight ? `
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white flex items-center mb-1 text-xs uppercase tracking-wider text-purple-600 dark:text-purple-400">🌐 複数研究から言える総合知見</h3>
              <p class="leading-relaxed bg-purple-50 dark:bg-purple-950/30 text-purple-950 dark:text-purple-200 p-3 rounded-lg border border-purple-100 dark:border-purple-900/50">${paper.overall_insight}</p>
            </div>
            ` : ''}

            <!-- ★日常での具体活用（場面とアクション） -->
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white flex items-center mb-1 text-xs uppercase tracking-wider text-emerald-600 dark:text-emerald-400">🌱 日常での具体的な使いどころ</h3>
              <div class="bg-emerald-50 dark:bg-emerald-950/30 text-emerald-950 dark:text-emerald-200 p-3 rounded-lg border border-emerald-100 dark:border-emerald-900/50 space-y-2">
                <p><strong>【使いたい場面】</strong> ${paper.application_scene || paper.application || '日常のあらゆる場面'}</p>
                <p><strong>【具体アクション】</strong> ${paper.application_action || '研究結果を意識して行動してみましょう。'}</p>
              </div>
            </div>
          </div>
      `).join('');
    }

// 2. 選択されたエンジン（OpenAlex / Semantic Scholar）でのライブ論文サーチ
// 検索実行関数（エラー処理強化版）
    async function executeLiveSearch() {
      const keyword = document.getElementById('liveSearchInput').value.trim();
      if (!keyword) return;

      const engine = document.getElementById('searchEngineSelect').value;
      const loading = document.getElementById('liveLoading');
      const grid = document.getElementById('liveResultsGrid');

      loading.classList.remove('hidden');
      grid.innerHTML = '';

      try {
        liveSearchResults = [];

        if (engine === 'openalex') {
          const url = `https://api.openalex.org/works?search=${encodeURIComponent(keyword)}&per-page=10`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`OpenAlex APIエラー: Status ${res.status}`);
          const data = await res.json();
          
          liveSearchResults = (data.results || []).map((item, index) => {
            let abstractText = "";
            if (item.abstract_inverted_index) {
              const wordPositions = [];
              for (const [word, positions] of Object.entries(item.abstract_inverted_index)) {
                for (const pos of positions) wordPositions.push([pos, word]);
              }
              wordPositions.sort((a, b) => a[0] - b[0]);
              abstractText = wordPositions.map(x => x[1]).join(' ');
            }
            return {
              id: index,
              title: item.title || "タイトルなし",
              year: item.publication_year || '不明',
              citeCount: item.cited_by_count || 0,
              abstract: abstractText || "アブストラクト情報はありません。",
              url: item.doi || item.id,
              source: 'OpenAlex'
            };
          });
        } else {
          const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(keyword)}&limit=10&fields=title,abstract,year,citationCount,url`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`Semantic Scholar APIエラー: Status ${res.status}`);
          const data = await res.json();
          
          liveSearchResults = (data.data || []).map((item, index) => ({
            id: index,
            title: item.title || "タイトルなし",
            year: item.year || '不明',
            citeCount: item.citationCount || 0,
            abstract: item.abstract || "アブストラクト情報はありません。",
            url: item.url,
            source: 'Semantic Scholar'
          }));
        }

        loading.classList.add('hidden');

        if (liveSearchResults.length === 0) {
          grid.innerHTML = `<div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-500">該当する論文が見つかりませんでした。英語のキーワードを変えて試してください。</div>`;
          return;
        }

        // 論文カード一覧と「要約」ボタンの表示
        grid.innerHTML = liveSearchResults.map(item => `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm transition-colors" id="paper-card-${item.id}">
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                ${item.source} (${item.year})
              </span>
              <span class="text-xs text-slate-400">被引用数: ${item.citeCount}回</span>
            </div>
            
            <div class="flex justify-between items-start gap-4 mb-2">
              <h3 class="font-bold text-slate-900 text-base leading-snug flex-grow">${item.title}</h3>
              <button onclick="summarizePaperOnClient(${item.id})" id="btn-sum-${item.id}" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg whitespace-nowrap transition-colors flex items-center space-x-1">
                <span>✨ 要約</span>
              </button>
            </div>

            <p class="text-xs text-slate-600 bg-slate-50 p-3 rounded border border-slate-100 line-clamp-3 leading-relaxed mb-3">
              ${item.abstract}
            </p>

            <!-- 要約結果が挿入されるエリア -->
            <div id="ai-summary-result-${item.id}" class="hidden my-3"></div>

            <div class="text-right">
              <a href="${item.url}" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline">論文の原文を開く ↗</a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        loading.classList.add('hidden');
        grid.innerHTML = `
          <div class="bg-red-50 text-red-700 p-4 rounded-xl text-center text-sm border border-red-200">
            検索エラーが発生しました (${err.message})。<br>
            検索キーワードを英語（例: memory, sleep）にするか、検索エンジンを「OpenAlex」に切り替えてお試しください。
          </div>
        `;
      }
    }

    // 「要約」ボタンが押された時の即時AI要約処理
    async function summarizePaperOnClient(paperId) {
      const paper = liveSearchResults.find(p => p.id === paperId);
      if (!paper) return;

      // Gemini API Keyの取得 (保存されていない場合は入力を求める)
      let apiKey = localStorage.getItem('user_gemini_key');
      if (!apiKey) {
        apiKey = prompt("リアルタイム要約を行うために、Google Gemini API Keyを入力してください（ブラウザ内に安全に保存されます）:");
        if (!apiKey) return;
        localStorage.setItem('user_gemini_key', apiKey);
      }

      const btn = document.getElementById(`btn-sum-${paperId}`);
      const resultDiv = document.getElementById(`ai-summary-result-${paperId}`);

      btn.disabled = true;
      btn.innerHTML = `<span>⏳ 要約中...</span>`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
        const promptText = `
以下の心理学論文を初心者向けに超わかりやすく日本語要約してください。

タイトル: ${paper.title}
アブストラクト: ${paper.abstract}

出力フォーマット(JSON形式のみ):
{
  "summary": "中学生でもわかる1文まとめ",
  "findings": "何がわかったのか",
  "application": "日常でどう活かせるか"
}
`;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        if (!res.ok) throw new Error("APIキーが無効か、通信エラーが発生しました。");
        const resData = await res.json();
        const aiJson = JSON.parse(resData.candidates[0].content.parts[0].text);

        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `
          <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-lg text-xs space-y-2 text-slate-800">
            <p class="font-bold text-indigo-900 text-sm">💡 初心者向けAI要約結果</p>
            <p><strong>【超要約】</strong> ${aiJson.summary}</p>
            <p><strong>【わかったこと】</strong> ${aiJson.findings}</p>
            <p><strong>【日常での使いどころ】</strong> ${aiJson.application}</p>
          </div>
        `;

        btn.innerHTML = `<span>済</span>`;
        btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
      } catch (err) {
        alert("要約エラー: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<span>✨ 要約</span>`;
        // エラー時はキーを再入力できるようにクリア可能にする
        if (confirm("APIキーを再設定しますか？")) {
          localStorage.removeItem('user_gemini_key');
        }
      }
    }

    // イベント設定
    document.getElementById('searchInput').addEventListener('input', renderPapers);
    document.getElementById('liveSearchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeLiveSearch();
    });

    // 初期実行
    loadPapers();
  </script>
</body>
</html>
